<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hospital System Login</title><link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="css/style.css"></head><body><div class="login"><h1>🏥 MediCare DBMS</h1><p class="muted">Hospital Appointment & Billing System</p><form id="login"><div class="field"><label>Username</label><input id="username" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn">Sign in</button><div class="demo">Academic demo authentication: credentials are not sent to a server.</div></form></div><script>document.querySelector('#login').addEventListener('submit',e=>{e.preventDefault();sessionStorage.setItem('demoUser',document.querySelector('#username').value);location.href='dashboard.html'});</script></body></html>
