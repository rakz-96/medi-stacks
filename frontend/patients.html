<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patients - Hospital System</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/tables.css"></head><body><script src="js/api.js"></script><script>document.write(shell('Patients',`<div class="toolbar"><input id="search" placeholder="Search name or phone"><button class="btn" id="add">Add Patient</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>DOB</th><th>Gender</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div id="modal" class="modal"><div class="card"><h2 id="modalTitle">Add Patient</h2><form id="form"><input type="hidden" id="id"><div class="form-grid"><div class="field"><label>Full name</label><input id="fullName" required></div><div class="field"><label>Date of birth</label><input id="dob" type="date" required></div><div class="field"><label>Gender</label><select id="gender"><option>MALE</option><option>FEMALE</option><option>OTHER</option></select></div><div class="field"><label>Phone</label><input id="phone" pattern="[0-9]{10}" required></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field full"><label>Address</label><textarea id="address"></textarea></div></div><div class="actions"><button type="button" class="btn secondary" id="close">Cancel</button><button class="btn">Save</button></div></form></div></div>`));nav();</script><script src="js/patients.js"></script></body></html>
