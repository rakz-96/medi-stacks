<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctors - Hospital System</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/tables.css"></head><body><script src="js/api.js"></script><script>document.write(shell('Doctors',`<div class="toolbar"><input id="search" placeholder="Search doctor or specialization"><button class="btn" id="add">Add Doctor</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Department</th><th>Phone</th><th>Fee</th><th>Hours</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div id="modal" class="modal"><div class="card"><h2>Add/Edit Doctor</h2><form id="form"><input type="hidden" id="id"><div class="form-grid"><div class="field"><label>Name</label><input id="fullName" required></div><div class="field"><label>Specialization</label><input id="specialization" required></div><div class="field"><label>Department</label><select id="departmentId" required></select></div><div class="field"><label>Phone</label><input id="phone" pattern="[0-9]{10}" required></div><div class="field"><label>Consultation fee</label><input id="fee" type="number" min="0" step="0.01" required></div><div class="field"><label>Available from</label><input id="from" type="time" required></div><div class="field"><label>Available to</label><input id="to" type="time" required></div></div><div class="actions"><button type="button" class="btn secondary" id="close">Cancel</button><button class="btn">Save</button></div></form></div></div>`));nav();</script><script src="js/doctors.js"></script></body></html>
