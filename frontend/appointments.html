<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointments - Hospital System</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/tables.css"></head><body><script src="js/api.js"></script><script>document.write(shell('Appointments',`<div class="toolbar"><button class="btn" id="add">Book Appointment</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Department</th><th>Date</th><th>Time</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div id="modal" class="modal"><div class="card"><h2>Book Appointment</h2><form id="form"><div class="form-grid"><div class="field"><label>Patient</label><select id="patientId" required></select></div><div class="field"><label>Doctor</label><select id="doctorId" required></select></div><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Time</label><input id="time" type="time" required></div><div class="field full"><label>Reason</label><textarea id="reason"></textarea></div></div><div class="actions"><button type="button" class="btn secondary" id="close">Cancel</button><button class="btn">Book</button></div></form></div></div>`));nav();</script><script src="js/appointments.js"></script></body></html>
