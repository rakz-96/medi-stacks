spring.application.name=hospital-system
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=change_me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.cors.allowed-origins=http://localhost:5500,http://localhost:8080,http://127.0.0.1:5500
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
